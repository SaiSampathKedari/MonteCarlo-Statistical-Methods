[project]
name = "montecarlo-statistical-methods"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "sampling",
    "utils",
    "importance_sampling",
    "variance_reduction",
    "stochastic_processes",
    "mcmc"
]